<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GoSushi • Delivery de comida japonesa</title>
  <meta name="description" content="GoSushi: sushi fresco, combinados e temakis com entrega rápida. Peça pelo computador ou celular.">
  <meta name="theme-color" content="#fffdfa">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script>
    (function () {
      var pref = 'system';
      try { var raw = localStorage.getItem('gosushi:theme'); if (raw) pref = JSON.parse(raw); } catch (e) {}
      var dark = pref === 'dark' || (pref === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite" aria-atomic="false"></div>
  <noscript><p style="padding:24px;font-family:sans-serif">Ative o JavaScript para usar o GoSushi.</p></noscript>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
